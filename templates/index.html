<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turf Analyzer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #e2e8f0; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; padding: 20px 0; color: #10b981; font-size: 1.8em; }
  .subtitle { text-align: center; color: #64748b; margin-bottom: 10px; font-size: 0.9em; }

  .stats-bar { background: #1e293b; border-radius: 8px; padding: 8px 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; }
  .stats-bar .status { display: flex; align-items: center; gap: 8px; }
  .stats-bar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
  .dot.ready { background: #10b981; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .stats-bar .info { color: #64748b; font-size: 0.8em; }
  .progress-bar { background: #334155; border-radius: 4px; height: 4px; width: 120px; margin-left: 10px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .progress-fill { height: 100%; background: #10b981; transition: width 0.5s; }
  .stats-bar button { background: #334155; color: #94a3b8; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }

  .nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
  .nav a { color: #94a3b8; text-decoration: none; padding: 8px 16px; border: 1px solid #334155; border-radius: 6px; font-size: 0.9em; }
  .nav a:hover, .nav a.active { color: #10b981; border-color: #10b981; background: #1e293b; }

  .date-selector { display: flex; justify-content: center; gap: 10px; align-items: center; margin-bottom: 20px; }
  .date-selector input { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 0.9em; }
  .date-selector button { background: #10b981; color: #0f172a; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  .date-selector button:hover { background: #059669; }

  .loading { text-align: center; padding: 40px; color: #64748b; }
  .error { color: #ef4444; text-align: center; padding: 20px; }

  .reunion { background: #1e293b; border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
  .reunion-header { background: #334155; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .reunion-header:hover { background: #3d4f66; }
  .reunion-title { font-weight: bold; color: #10b981; }
  .reunion-hippo { color: #94a3b8; font-size: 0.9em; }
  .course-item { padding: 10px 20px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
  .course-item:hover { background: #1a2744; }
  .course-item:last-child { border-bottom: none; }
  .course-left { display: flex; gap: 15px; align-items: center; }
  .course-num { background: #10b981; color: #0f172a; font-weight: bold; padding: 4px 10px; border-radius: 4px; font-size: 0.85em; min-width: 60px; text-align: center; }
  .course-name { font-size: 0.95em; }
  .course-meta { color: #64748b; font-size: 0.8em; }
  .course-right { display: flex; gap: 10px; align-items: center; }
  .discipline-tag { font-size: 0.75em; padding: 3px 8px; border-radius: 4px; background: #334155; color: #94a3b8; }
  .analyze-btn { background: #10b981; color: #0f172a; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; }
  .analyze-btn:hover { background: #059669; }

  .course-detail { background: #1e293b; border-radius: 10px; margin-top: 20px; overflow: hidden; }
  .detail-header { background: #334155; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
  .detail-title { color: #10b981; font-weight: bold; }
  .detail-info { color: #94a3b8; font-size: 0.85em; }
  .close-btn { background: none; border: 1px solid #64748b; color: #94a3b8; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
  .close-btn:hover { border-color: #e2e8f0; color: #e2e8f0; }

  .ranking-table { width: 100%; border-collapse: collapse; }
  .ranking-table th { text-align: left; padding: 10px 12px; background: #0f172a; color: #64748b; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; }
  .ranking-table td { padding: 10px 12px; border-bottom: 1px solid #334155; font-size: 0.9em; vertical-align: middle; }
  .ranking-table tr:hover { background: #1a2744; }
  .ranking-table tr.top1 { background: rgba(16, 185, 129, 0.08); }
  .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; font-size: 0.85em; }
  .rank-1 { background: #10b981; color: #0f172a; }
  .rank-2 { background: #3b82f6; color: white; }
  .rank-3 { background: #f59e0b; color: #0f172a; }
  .rank-other { background: #334155; color: #94a3b8; }
  .cheval-name { font-weight: 600; }
  .score-bar-bg { background: #334155; border-radius: 3px; height: 8px; width: 60px; display: inline-block; vertical-align: middle; margin-left: 6px; }
  .score-bar-fill { height: 100%; border-radius: 3px; }
  .score-green { background: #10b981; }
  .score-yellow { background: #f59e0b; }
  .score-red { background: #ef4444; }
  .score-gray { background: #475569; }
  .cote-val { font-weight: bold; color: #3b82f6; }
  .edge-pos { color: #10b981; font-weight: bold; }
  .edge-neg { color: #ef4444; }
  .arrivee-badge { padding: 2px 6px; border-radius: 3px; font-size: 0.8em; font-weight: bold; }
  .arrivee-1 { background: #10b981; color: #0f172a; }
  .arrivee-2 { background: #3b82f6; color: white; }
  .arrivee-3 { background: #f59e0b; color: #0f172a; }
  .arrivee-other { background: #334155; color: #94a3b8; }
  .table-wrap { overflow-x: auto; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .nb-info { font-size: 0.7em; color: #64748b; }
</style>
</head>
<body>
<div class="container">
  <h1>🐎 Turf Analyzer</h1>
  <p class="subtitle">Modèle v9 — modèle + marché (proba gagnant, top 3, cote juste &amp; value bets)</p>

  <div class="stats-bar">
    <div class="status" id="stats-status">
      <span class="dot loading" id="stats-dot"></span>
      <span id="stats-text">Calcul des stats en cours...</span>
      <div class="progress-bar" id="progress-container" style="display:none;">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="info" id="stats-info"></div>
    <button onclick="refreshStats()" title="Recalculer">🔄</button>
  </div>

  <div class="nav">
    <a href="/admin" class="active">📋 Courses</a>
    <a href="/backtest">📈 Backtest</a>
    <a href="/bilan">📊 Bilan</a>
    <a href="/logout" style="margin-left:auto;">🔓 Déconnexion</a>
  </div>

  <div class="date-selector">
    <label style="color:#94a3b8;">Date :</label>
    <input type="date" id="dateInput">
    <button onclick="loadCourses()">🔄 Charger</button>
  </div>

  <div id="courses-list" class="loading">Chargement des courses...</div>
  <div id="course-detail"></div>
</div>

<script>
  const today = new Date();
  document.getElementById('dateInput').value = today.toISOString().split('T')[0];

  function formatDate(val) {
    const d = new Date(val);
    return d.getDate().toString().padStart(2,'0') +
           (d.getMonth()+1).toString().padStart(2,'0') +
           d.getFullYear();
  }

  // ── Stats status ──
  async function checkStatsStatus() {
    try {
      const res = await fetch('/api/stats-status');
      const data = await res.json();

      const dot = document.getElementById('stats-dot');
      const text = document.getElementById('stats-text');
      const info = document.getElementById('stats-info');
      const pbar = document.getElementById('progress-container');
      const pfill = document.getElementById('progress-fill');

      if (data.status === 'ready') {
        dot.className = 'dot ready';
        text.textContent = '✅ Stats chargées';
        info.textContent = `${data.horses||''}ch · ${data.drivers||''}dr · ${data.trainers||''}ent`;
        pbar.style.display = 'none';
      } else if (data.status === 'loading') {
        dot.className = 'dot loading';
        text.textContent = data.message || '⏳ Calcul...';
        const pct = data.progress || 0;
        info.textContent = `${data.done||0}/${data.total||''}`;
        pbar.style.display = 'inline-block';
        pfill.style.width = pct + '%';
      } else if (data.status === 'error') {
        dot.className = 'dot ready';
        text.textContent = '⚠️ Stats indisponibles — scores PMU seuls';
        info.textContent = '';
        pbar.style.display = 'none';
      }
    } catch(e) { /* silent */ }
  }

  async function refreshStats() {
    try { await fetch('/api/force-refresh-stats', {method:'POST'}); } catch(e) {}
    checkStatsStatus();
  }

  // ── Courses ──
  async function loadCourses() {
    const dateVal = document.getElementById('dateInput').value;
    if (!dateVal) return;
    const dateStr = formatDate(dateVal);
    const el = document.getElementById('courses-list');
    el.innerHTML = '<div class="loading">⏳ Chargement...</div>';
    document.getElementById('course-detail').innerHTML = '';

    try {
      const res = await fetch(`/api/reunions?date=${dateStr}`);
      const data = await res.json();
      if (data.error) { el.innerHTML = `<div class="error">${data.error}</div>`; return; }
      if (!data.reunions || data.reunions.length === 0) { el.innerHTML = '<div class="loading">Aucune course</div>'; return; }

      let html = '';
      data.reunions.forEach(r => {
        html += `<div class="reunion">
          <div class="reunion-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
            <span class="reunion-title">R${r.numReunion} — ${r.hippodrome}</span>
            <span style="color:#94a3b8;font-size:0.9em;">${r.courses.length} course(s)</span>
          </div>
          <div class="reunion-courses">`;
        r.courses.forEach(c => {
          const disc = c.discipline ? c.discipline.replace('TROT_','').replace('GALOP_','') : '?';
          const badge = c.arriveeDefinitive ? '<span style="color:#10b981;font-size:0.8em;">✅</span>' : '<span style="color:#64748b;font-size:0.8em;">⏳</span>';
          html += `<div class="course-item">
            <div class="course-left">
              <span class="course-num">C${c.numCourse}</span>
              <div>
                <div class="course-name">${c.libelle || ''}</div>
                <div class="course-meta">${c.heure} · ${c.distance||'?'}m · ${c.nbPartants||'?'} part.</div>
              </div>
            </div>
            <div class="course-right">
              <span class="discipline-tag">${disc}</span>
              ${badge}
              <button class="analyze-btn" onclick="analyzeCourse(${r.numReunion},${c.numCourse},'${dateStr}')">Analyser</button>
            </div>
          </div>`;
        });
        html += '</div></div>';
      });
      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="error">Erreur: ${e.message}</div>`;
    }
  }

  // ── Analyser ──
  async function analyzeCourse(rNum, cNum, dateStr) {
    const el = document.getElementById('course-detail');
    el.innerHTML = '<div class="loading"><span class="spinner"></span>Chargement...</div>';
    el.scrollIntoView({ behavior: 'smooth' });

    try {
      const res = await fetch(`/api/course/${rNum}/${cNum}?date=${dateStr}`);
      if (!res.ok) { const d = await res.json(); el.innerHTML = `<div class="error">${d.error}</div>`; return; }
      const data = await res.json();
      if (data.error) { el.innerHTML = `<div class="error">${data.error}</div>`; return; }

      const course = data.course || {};
      const analyses = data.analyses || [];

      let html = `<div class="course-detail">
        <div class="detail-header">
          <div>
            <span class="detail-title">R${rNum}C${cNum}</span>
            <span class="detail-info" style="margin-left:15px;">${course.discipline||''} ${course.distance||''}m · ${course.nbPartants||'?'} part.</span>
          </div>
          <button class="close-btn" onclick="document.getElementById('course-detail').innerHTML=''">✕</button>
        </div>
        <div class="table-wrap">
        <table class="ranking-table">
          <thead><tr>
            <th>#</th><th>Cheval</th><th>Driver</th><th>Ent.</th>
            <th>Courses</th>
            <th>Sc. Cheval</th><th>Sc. Driver</th><th>Sc. Ent.</th>
            <th>Score</th><th>Proba</th><th>Cote</th><th>Cote juste</th><th>Edge</th><th>Arrivée</th>
          </tr></thead><tbody>`;

      // Bannière de sélection (recommandation de pari sur le #1)
      if (analyses.length && analyses[0].selection) {
        const sel = analyses[0].selection;
        const col = sel.jouer ? '#10b981' : (sel.niveau === 'MOYENNE' ? '#f59e0b' : '#64748b');
        html += `<tr><td colspan="14" style="background:${col}22;border:none;padding:8px 16px;">
          <span style="color:${col};font-weight:bold;">${sel.label}</span>
          <span style="color:#94a3b8;font-size:0.85em;margin-left:12px;">
            confiance ${sel.niveau} — historique : ${sel.hist_top1}% gagnant / ${sel.hist_top3}% placé (${sel.part_courses}% des courses)
          </span></td></tr>`;
      }

      analyses.forEach((a, i) => {
        const rank = a.rang || (i + 1);
        const rc = rank <= 3 ? `rank-${rank}` : 'rank-other';
        const tr = rank === 1 ? 'top1' : '';
        const s = a.scores || {};

        function bar(val) {
          if (val === null || val === undefined) return '<span style="color:#475569;">—</span>';
          const c = val >= 65 ? 'score-green' : val >= 45 ? 'score-yellow' : 'score-red';
          return `${Math.round(val)}<span class="score-bar-bg"><span class="score-bar-fill ${c}" style="width:${Math.max(2,val)}%"></span></span>`;
        }
        function badge(place) {
          if (!place || place === 0) return '<span style="color:#475569;">—</span>';
          const c = place===1?'arrivee-1':place===2?'arrivee-2':place===3?'arrivee-3':'arrivee-other';
          return `<span class="arrivee-badge ${c}">${place}</span>`;
        }
        const ev = a.edge || 0;
        const eh = ev >= 3 ? `<span class="edge-pos">+${ev}</span>` : ev <= -3 ? `<span class="edge-neg">${ev}</span>` : `<span style="color:#64748b;">${ev}</span>`;

        html += `<tr class="${tr}">
          <td><span class="rank-badge ${rc}">${rank}</span></td>
          <td><span class="cheval-name">${a.nom}</span>
            <span class="nb-info">${a.nbCourses}c ${a.nbVictoires}v</span></td>
          <td style="font-size:0.85em;">${a.driver}</td>
          <td style="font-size:0.85em;">${a.entraineur}</td>
          <td style="text-align:center;font-size:0.85em;">${a.nbCourses || '—'}</td>
          <td>${bar(s.cheval)}</td>
          <td>${bar(s.driver)}</td>
          <td>${bar(s.entraineur)}</td>
          <td><strong style="color:#10b981;">${Math.round(s.composite)}</strong></td>
          <td><strong>${a.proba != null ? a.proba.toFixed(1) : '—'}%</strong>
            <span class="nb-info">t3 ${a.probaTop3 != null ? a.probaTop3.toFixed(0) : '—'}%</span>
            <span class="score-bar-bg" style="width:70px;"><span class="score-bar-fill score-green" style="width:${Math.min(100, (a.proba||0)*2.5)}%"></span></span></td>
          <td class="cote-val">${a.cote ? a.cote.toFixed(1) : '—'}</td>
          <td style="color:#94a3b8;">${a.fairOdds ? a.fairOdds.toFixed(1) : '—'}</td>
          <td>${eh}</td>
          <td>${badge(a.ordreArrivee)}</td>
        </tr>`;
      });

      html += '</tbody></table></div></div>';
      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="error">Erreur: ${e.message}</div>`;
    }
  }

  // ── Init ──
  loadCourses();
  checkStatsStatus();
  setInterval(checkStatsStatus, 3000);
</script>
</body>
</html>
