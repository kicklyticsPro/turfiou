<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turf Analyzer — Simple</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #e2e8f0; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; padding: 30px 0; color: #10b981; font-size: 2em; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; }
  .card h2 { color: #10b981; margin-bottom: 15px; font-size: 1.2em; }
  .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; }
  .stat:last-child { border-bottom: none; }
  .stat-label { color: #94a3b8; }
  .stat-value { font-weight: bold; color: #10b981; }
  .stat-value.bad { color: #ef4444; }
  .loading { text-align: center; padding: 40px; color: #64748b; }
  .error { color: #ef4444; text-align: center; padding: 20px; }
  .nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
  .nav a { color: #10b981; text-decoration: none; padding: 8px 16px; border: 1px solid #10b981; border-radius: 6px; }
  .nav a:hover { background: #10b981; color: #0f172a; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px; background: #334155; color: #94a3b8; font-size: 0.85em; text-transform: uppercase; }
  td { padding: 10px; border-bottom: 1px solid #334155; font-size: 0.9em; }
  tr:hover { background: #1e293b; }
  .score-bar { display: inline-block; height: 6px; border-radius: 3px; background: #10b981; min-width: 2px; }
  .select-row { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
  select, button { background: #334155; color: #e2e8f0; border: none; padding: 8px 16px; border-radius: 6px; font-size: 0.9em; }
  button { background: #10b981; cursor: pointer; }
  button:hover { background: #059669; }
</style>
</head>
<body>
<div class="container">
  <h1>🐎 Turf Analyzer</h1>
  <p class="subtitle">Analyse basée sur 3 piliers : Cheval • Driver • Entraîneur</p>

  <div class="nav">
    <a href="/admin">Analyse</a>
    <a href="/backtest">Backtest</a>
    <a href="/bilan">Bilan</a>
  </div>

  <div class="grid">
    <div class="card">
      <h2>📊 Résumé du jour</h2>
      <div id="summary" class="loading">Chargement...</div>
    </div>
    <div class="card">
      <h2>🏆 Top Drivers</h2>
      <div id="top-drivers" class="loading">Chargement...</div>
    </div>
  </div>
</div>

<script>
  async function loadSummary() {
    try {
      const res = await fetch('/api/programme');
      const data = await res.json();
      if (data.reunions && data.reunions.length > 0) {
        let totalCourses = 0;
        data.reunions.forEach(r => totalCourses += r.courses.length);
        document.getElementById('summary').innerHTML = `
          <div class="stat"><span class="stat-label">Réunions</span><span class="stat-value">${data.reunions.length}</span></div>
          <div class="stat"><span class="stat-label">Courses</span><span class="stat-value">${totalCourses}</span></div>
          <div class="stat"><span class="stat-label">Date</span><span class="stat-value">${data.date}</span></div>
        `;
      } else {
        document.getElementById('summary').innerHTML = '<p class="error">Aucune course aujourd\'hui</p>';
      }
    } catch(e) {
      document.getElementById('summary').innerHTML = `<p class="error">Erreur: ${e.message}</p>`;
    }
  }

  async function loadTopDrivers() {
    try {
      const res = await fetch('/api/team-stats');
      const data = await res.json();
      if (data.drivers && data.drivers.length > 0) {
        let html = '<table><tr><th>Driver</th><th>Courses</th><th>Victoires</th><th>% Vict.</th></tr>';
        data.drivers.slice(0, 8).forEach(d => {
          html += `<tr>
            <td>${d.nom}</td>
            <td>${d.courses}</td>
            <td>${d.victoires}</td>
            <td>${d.taux_victoire}%</td>
          </tr>`;
        });
        html += '</table>';
        document.getElementById('top-drivers').innerHTML = html;
      } else {
        document.getElementById('top-drivers').innerHTML = '<p class="error">Pas de données</p>';
      }
    } catch(e) {
      document.getElementById('top-drivers').innerHTML = `<p class="error">Erreur: ${e.message}</p>`;
    }
  }

  loadSummary();
  loadTopDrivers();
</script>
</body>
</html>
