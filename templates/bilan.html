<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilan — Turf Analyzer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #e2e8f0; }
  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; padding: 30px 0; color: #10b981; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 20px; }
  .nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
  .nav a { color: #10b981; text-decoration: none; padding: 8px 16px; border: 1px solid #10b981; border-radius: 6px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card h2 { color: #10b981; margin-bottom: 15px; }
  .day-card { background: #334155; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
  .day-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .day-date { font-weight: bold; color: #e2e8f0; }
  .day-stats { display: flex; gap: 20px; font-size: 0.85em; color: #94a3b8; }
  .day-courses { font-size: 0.8em; margin-top: 8px; }
  .course-row { display: inline-block; margin: 3px 8px; padding: 3px 8px; background: #1e293b; border-radius: 4px; font-size: 0.8em; }
  .win { color: #10b981; }
  .place { color: #f59e0b; }
  .loss { color: #ef4444; }
  .loading { text-align: center; padding: 40px; color: #64748b; }
  .error { color: #ef4444; text-align: center; }
  .totals { background: #10b981; color: #0f172a; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.1em; margin-bottom: 20px; }
  select, button { background: #334155; color: #e2e8f0; border: none; padding: 8px 16px; border-radius: 6px; }
  button { background: #10b981; cursor: pointer; }
  button:hover { background: #059669; }
  .select-row { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 Bilan Quotidien</h1>
  <p class="subtitle">Où finit le #1 du composite chaque jour ?</p>

  <div class="nav">
    <a href="/admin">Analyse</a>
    <a href="/backtest">Backtest</a>
    <a href="/bilan">Bilan</a>
  </div>

  <div class="select-row">
    <label>Jours :</label>
    <select id="days">
      <option value="7">7 jours</option>
      <option value="14">14 jours</option>
      <option value="21">21 jours</option>
      <option value="30">30 jours</option>
    </select>
    <button onclick="loadBilan()">Charger</button>
  </div>

  <div id="totals"></div>
  <div id="results" class="loading">Sélectionnez une période</div>
</div>

<script>
  async function loadBilan() {
    const days = document.getElementById('days').value;
    const el = document.getElementById('results');
    el.innerHTML = '<div class="loading">⏳ Chargement...</div>';

    try {
      const res = await fetch(`/api/bilan?days=${days}`);
      const data = await res.json();
      
      if (data.error) {
        el.innerHTML = `<div class="error">Erreur: ${data.error}</div>`;
        return;
      }

      // Totals bar
      const t = data.totals;
      document.getElementById('totals').innerHTML = `
        <div class="totals">
          🏁 ${t.total} courses — 
          🥇 ${t.top1} (${t.taux_top1}%) — 
          🥈 ${t.top2} — 
          🥉 ${t.top3} — 
          ❌ ${t.hors}
        </div>`;

      let html = '<div class="card"><h2>📅 Résultats par jour</h2>';
      data.daily.forEach(d => {
        html += `<div class="day-card">
          <div class="day-header">
            <span class="day-date">${d.jour} ${d.date_short}</span>
            <span>${d.total} courses</span>
          </div>
          <div class="day-stats">
            <span class="win">🥇 ${d.top1} (${d.taux_top1}%)</span>
            <span class="place">🥈 ${d.top2}</span>
            <span class="place">🥉 ${d.top3}</span>
            <span class="loss">❌ ${d.hors}</span>
          </div>
          <div class="day-courses">`;
        d.courses.forEach(c => {
          const cls = c.resultat === '🥇' ? 'win' : c.resultat === '🥈' ? 'place' : c.resultat === '🥉' ? 'place' : 'loss';
          html += `<span class="course-row">${c.nom} — <span class="${cls}">${c.resultat}</span> (cote: ${c.cote || '—'})</span>`;
        });
        html += '</div></div>';
      });
      html += '</div>';
      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="error">Erreur: ${e.message}</div>`;
    }
  }
</script>
</body>
</html>
