<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest — Turf Analyzer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #e2e8f0; }
  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; padding: 30px 0; color: #10b981; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 20px; }
  .nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
  .nav a { color: #10b981; text-decoration: none; padding: 8px 16px; border: 1px solid #10b981; border-radius: 6px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card h2 { color: #10b981; margin-bottom: 15px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  .stat-box { background: #334155; padding: 15px; border-radius: 8px; text-align: center; }
  .stat-box .value { font-size: 2em; font-weight: bold; color: #10b981; }
  .stat-box .label { color: #94a3b8; font-size: 0.85em; margin-top: 5px; }
  .stat-box .value.bad { color: #ef4444; }
  .stat-box .value.warn { color: #f59e0b; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th { text-align: left; padding: 10px; background: #334155; color: #94a3b8; font-size: 0.85em; text-transform: uppercase; }
  td { padding: 10px; border-bottom: 1px solid #334155; }
  tr:hover { background: #1e293b; }
  .select-row { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 20px; }
  select, button { background: #334155; color: #e2e8f0; border: none; padding: 8px 16px; border-radius: 6px; }
  button { background: #10b981; cursor: pointer; }
  button:hover { background: #059669; }
  .loading { text-align: center; padding: 40px; color: #64748b; }
  .error { color: #ef4444; text-align: center; }
  .value-bet { color: #f59e0b; }
  .win { color: #10b981; }
  .loss { color: #ef4444; }
</style>
</head>
<body>
<div class="container">
  <h1>📈 Backtest</h1>
  <p class="subtitle">Performance du modèle sur les courses passées</p>

  <div class="nav">
    <a href="/admin">Analyse</a>
    <a href="/backtest">Backtest</a>
    <a href="/bilan">Bilan</a>
  </div>

  <div class="select-row">
    <label>Jours :</label>
    <select id="days">
      <option value="7">7 jours</option>
      <option value="14">14 jours</option>
      <option value="21">21 jours</option>
      <option value="30">30 jours</option>
    </select>
    <button onclick="runBacktest()">Lancer</button>
  </div>

  <div id="results" class="loading">Sélectionnez une période et lancez le backtest</div>
</div>

<script>
  async function runBacktest() {
    const days = document.getElementById('days').value;
    const el = document.getElementById('results');
    el.innerHTML = '<div class="loading">⏳ Chargement du backtest...</div>';

    try {
      const res = await fetch(`/api/backtest?days=${days}`);
      const data = await res.json();

      if (data.error) {
        el.innerHTML = `<div class="error">Erreur: ${data.error}</div>`;
        return;
      }

      const roiColor = data.roi >= 0 ? '' : 'bad';
      const tauxColor = data.taux_top1 >= 35 ? '' : 'warn';

      let html = `
        <div class="grid-3">
          <div class="stat-box"><div class="value">${data.total_courses}</div><div class="label">Courses</div></div>
          <div class="stat-box"><div class="value ${tauxColor}">${data.taux_top1}%</div><div class="label">Taux Top1</div></div>
          <div class="stat-box"><div class="value ${roiColor}">${data.roi}%</div><div class="label">ROI</div></div>
        </div>

        <div class="card" style="margin-top: 20px;">
          <h2>📊 Détails</h2>
          <table>
            <tr><th>Métrique</th><th>Valeur</th></tr>
            <tr><td>Top1 gagnant</td><td>${data.top1_winner} / ${data.total_courses}</td></tr>
            <tr><td>Top1 dans le Top3</td><td>${data.top1_top3} / ${data.total_courses} (${data.taux_top1_place}%)</td></tr>
            <tr><td>Mise totale</td><td>${data.mise_totale}€</td></tr>
            <tr><td>Gain total</td><td>${data.gain_total}€</td></tr>
            <tr><td>ROI</td><td>${data.roi}%</td></tr>
          </table>
        </div>`;

      // Value bets
      if (data.value_bets && data.value_bets.length > 0) {
        html += `<div class="card"><h2>💎 Value Bets (${data.vb_nb})</h2>`;
        html += `<table><tr><th>Date</th><th>Cheval</th><th>Cote</th><th>Edge</th><th>Résultat</th></tr>`;
        data.value_bets.slice(0, 20).forEach(vb => {
          const resClass = vb.gagne ? 'win' : 'loss';
          const resText = vb.gagne ? '✅ GAGNÉ' : '❌ PERDU';
          html += `<tr>
            <td>${vb.date} ${vb.course}</td>
            <td>${vb.cheval}</td>
            <td>${vb.cote}</td>
            <td class="value-bet">+${vb.edge}%</td>
            <td class="${resClass}">${resText}</td>
          </tr>`;
        });
        html += '</table></div>';
        html += `<div class="card"><h2>📈 Stats Value Bets</h2>
          <table>
            <tr><td>Nombre</td><td>${data.vb_nb}</td></tr>
            <tr><td>Taux de réussite</td><td>${data.vb_winrate}%</td></tr>
            <tr><td>ROI</td><td class="${data.vb_roi >= 0 ? 'win' : 'loss'}">${data.vb_roi}%</td></tr>
          </table>
        </div>`;
      }

      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="error">Erreur: ${e.message}</div>`;
    }
  }
</script>
</body>
</html>
