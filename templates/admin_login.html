<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Turf Analyzer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .login-card { background: #1e293b; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; text-align: center; }
  h1 { color: #10b981; margin-bottom: 10px; }
  .subtitle { color: #94a3b8; margin-bottom: 30px; }
  input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #334155; color: #e2e8f0; font-size: 1em; margin-bottom: 15px; }
  button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #10b981; color: #0f172a; font-size: 1em; font-weight: bold; cursor: pointer; }
  button:hover { background: #059669; }
  .error { color: #ef4444; margin-bottom: 15px; }
</style>
</head>
<body>
<div class="login-card">
  <h1>🐎 Turf Analyzer</h1>
  <p class="subtitle">Administration</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="POST">
    <input type="password" name="password" placeholder="Mot de passe" autofocus>
    <button type="submit">Connexion</button>
  </form>
</div>
</body>
</html>
