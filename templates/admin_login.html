<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Turfiou</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 380px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .login-card h1 {
    text-align: center; font-size: 26px; margin-bottom: 6px;
    background: linear-gradient(90deg, #10b981, #06b6d4);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .login-card .subtitle {
    text-align: center; color: #94a3b8; font-size: 13px;
    margin-bottom: 30px;
  }
  .login-card label {
    display: block; font-size: 12px; color: #94a3b8;
    margin-bottom: 6px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .login-card input[type=password] {
    width: 100%; padding: 12px 14px;
    background: #0f172a; border: 1px solid #334155;
    color: #e2e8f0; border-radius: 8px; font-size: 15px;
    margin-bottom: 20px; outline: none;
    transition: border-color .2s;
  }
  .login-card input[type=password]:focus {
    border-color: #10b981;
  }
  .login-card button {
    width: 100%; padding: 12px;
    background: linear-gradient(90deg, #10b981, #059669);
    color: white; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all .2s;
  }
  .login-card button:hover {
    background: linear-gradient(90deg, #059669, #047857);
    transform: translateY(-1px);
  }
  .error-msg {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid #ef4444;
    border-radius: 8px; padding: 10px 14px;
    color: #fca5a5; font-size: 13px;
    margin-bottom: 16px; text-align: center;
  }
  .back-link {
    text-align: center; margin-top: 20px;
  }
  .back-link a {
    color: #64748b; text-decoration: none; font-size: 13px;
    transition: color .2s;
  }
  .back-link a:hover { color: #94a3b8; }
</style>
</head>
<body>
<div class="login-card">
  <h1>🐎 Turfiou</h1>
  <p class="subtitle">Espace Administration</p>

  {% if error %}
  <div class="error-msg">❌ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password"
           placeholder="Entrez le mot de passe admin" autofocus required>
    <button type="submit">🔓 Connexion</button>
  </form>

  <div class="back-link">
    <a href="/">← Retour à la page publique</a>
  </div>
</div>
</body>
</html>
