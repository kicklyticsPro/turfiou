<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turf Analyzer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .hero { text-align: center; padding: 40px; }
  h1 { font-size: 3em; color: #10b981; margin-bottom: 15px; }
  p { color: #94a3b8; font-size: 1.2em; margin-bottom: 30px; }
  .pillars { display: flex; gap: 30px; justify-content: center; margin-bottom: 40px; }
  .pillar { background: #1e293b; padding: 25px; border-radius: 12px; width: 200px; }
  .pillar h3 { color: #10b981; margin-bottom: 10px; font-size: 1.1em; }
  .pillar p { font-size: 0.9em; color: #64748b; }
  .btn { display: inline-block; padding: 12px 30px; background: #10b981; color: #0f172a; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1.1em; }
  .btn:hover { background: #059669; }
</style>
</head>
<body>
<div class="hero">
  <h1>🐎 Turf Analyzer</h1>
  <p>Analyse hippique simple et efficace — 3 piliers, un classement</p>

  <div class="pillars">
    <div class="pillar"><h3>🏇 Cheval</h3><p>Stats carrière : courses, victoires, places</p></div>
    <div class="pillar"><h3>👤 Driver</h3><p>Stats jockey : win rate, place rate</p></div>
    <div class="pillar"><h3>🎓 Entraîneur</h3><p>Stats entraîneur : performance historique</p></div>
  </div>

  <a href="/login" class="btn">Accéder à l'analyse →</a>
</div>
</body>
</html>
