<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turfiou — Pronostics IA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0; min-height: 100vh;
  }
  header {
    background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #facc15;
    padding: 14px 20px; text-align: center;
    backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
  }
  header h1 {
    font-size: 22px;
    background: linear-gradient(90deg, #facc15, #f59e0b);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: #94a3b8; font-size: 12px; margin-top: 2px; }
  .ml-status {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 6px; font-size: 11px; padding: 3px 10px; border-radius: 20px;
  }
  .ml-status.ok { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #10b981; }
  .ml-status.training { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #f59e0b; animation: blink 1.5s infinite; }
  .ml-status.error, .ml-status.none { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
  .ml-status .ml-dot { width: 7px; height: 7px; border-radius: 50%; }
  .ml-status.ok .ml-dot { background: #10b981; }
  .ml-status.training .ml-dot { background: #f59e0b; }
  .ml-status.error .ml-dot, .ml-status.none .ml-dot { background: #ef4444; }

  /* ===== Onglets ===== */
  .tabs {
    display: flex; justify-content: center; gap: 4px;
    padding: 12px 12px 0; max-width: 860px; margin: 0 auto;
  }
  .tab-btn {
    flex: 1; max-width: 220px; padding: 9px 10px;
    background: rgba(30, 41, 59, 0.5); border: 1px solid #334155;
    border-bottom: none; border-radius: 10px 10px 0 0;
    color: #94a3b8; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .2s; text-align: center;
  }
  .tab-btn:hover { color: #e2e8f0; background: rgba(30, 41, 59, 0.8); }
  .tab-btn.active-crack { background: rgba(250,204,21,0.1); border-color: #facc15; color: #facc15; }
  .tab-btn.active-base { background: rgba(16,185,129,0.1); border-color: #10b981; color: #10b981; }
  .tab-btn.active-jour { background: rgba(239,68,68,0.1); border-color: #ef4444; color: #ef4444; }
  .tab-btn .tab-icon { font-size: 15px; }
  .tab-btn .tab-count {
    display: inline-block; background: #334155; color: #e2e8f0;
    padding: 1px 7px; border-radius: 10px; font-size: 11px;
    margin-left: 4px; font-weight: 600;
  }
  .tab-btn.active-crack .tab-count { background: #facc15; color: #0f172a; }
  .tab-btn.active-base .tab-count { background: #10b981; color: #0f172a; }
  .tab-btn.active-jour .tab-count { background: #ef4444; color: #fff; }

  .container { max-width: 860px; margin: 0 auto; padding: 0 16px 20px; }
  .date-bar {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; padding: 14px 0; flex-wrap: wrap;
  }
  .date-bar input[type=date] {
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    padding: 8px 14px; border-radius: 8px; font-size: 14px;
  }
  .date-bar button {
    background: #facc15; color: #0f172a; border: none;
    padding: 8px 18px; border-radius: 8px; font-size: 14px;
    font-weight: 700; cursor: pointer; transition: all .2s;
  }
  .date-bar button:hover { background: #f59e0b; }

  /* ===== Réunion block (cracks/base) ===== */
  .reunion-block {
    background: rgba(15, 23, 42, 0.6); border-radius: 16px;
    margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  }
  .reunion-header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    padding: 12px 18px; display: flex; justify-content: space-between;
    align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .reunion-header.crack-style { border-bottom: 2px solid #facc15; }
  .reunion-header.base-style { border-bottom: 2px solid #10b981; }
  .reunion-header .reunion-title { display: flex; align-items: center; gap: 10px; }
  .reunion-header .reunion-num {
    padding: 4px 12px; border-radius: 20px; font-size: 13px;
    font-weight: 800; letter-spacing: 0.5px;
  }
  .reunion-header .reunion-num.crack { background: linear-gradient(135deg, #facc15, #f59e0b); color: #0f172a; }
  .reunion-header .reunion-num.base { background: linear-gradient(135deg, #10b981, #06b6d4); color: #0f172a; }
  .reunion-header .reunion-hippo { font-size: 15px; font-weight: 700; color: #e2e8f0; }
  .reunion-header .reunion-count { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
  .reunion-header .reunion-count.crack { background: rgba(250,204,21,0.15); color: #facc15; }
  .reunion-header .reunion-count.base { background: rgba(16,185,129,0.15); color: #10b981; }
  .reunion-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

  .course-sep { display: flex; align-items: center; gap: 10px; margin-top: 4px; margin-bottom: 2px; }
  .course-sep .course-label { padding: 3px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; background: #0f172a; }
  .course-sep .course-label.crack { color: #06b6d4; }
  .course-sep .course-label.base { color: #10b981; }
  .course-sep .course-infos { color: #94a3b8; font-size: 12px; }
  .course-sep .course-heure { color: #f59e0b; font-weight: 700; font-size: 12px; margin-left: auto; white-space: nowrap; }

  /* ===== Horse card (cracks/base) ===== */
  .horse-card {
    border-radius: 12px; padding: 14px 18px; position: relative;
    transition: all .2s; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  }
  .horse-card:hover { transform: translateY(-1px); }
  .horse-card.crack { background: rgba(30,41,59,0.7); border: 1px solid rgba(250,204,21,0.3); }
  .horse-card.crack:hover { border-color: #facc15; box-shadow: 0 0 20px rgba(250,204,21,0.12); }
  .horse-card.base { background: rgba(30,41,59,0.7); border: 1px solid rgba(16,185,129,0.3); }
  .horse-card.base:hover { border-color: #10b981; box-shadow: 0 0 20px rgba(16,185,129,0.12); }
  .card-num { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; }
  .card-num.crack { background: linear-gradient(135deg, #facc15, #f59e0b); color: #0f172a; }
  .card-num.base { background: linear-gradient(135deg, #10b981, #06b6d4); color: #0f172a; }
  .card-main { flex: 1; min-width: 140px; }
  .card-main .card-nom { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
  .card-main .card-nom.crack { color: #facc15; }
  .card-main .card-nom.base { color: #10b981; }
  .card-main .card-details { display: flex; gap: 10px; flex-wrap: wrap; color: #94a3b8; font-size: 12px; }
  .card-main .card-details strong { color: #e2e8f0; }
  .card-main .card-musique {
    font-family: 'Courier New', monospace; background: #0f172a;
    padding: 2px 6px; border-radius: 3px; display: inline-block;
    color: #f59e0b; font-size: 11px; margin-top: 3px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
  .score-pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 5px 10px; }
  .score-pill.crack { background: rgba(250,204,21,0.1); border: 1px solid rgba(250,204,21,0.25); }
  .score-pill.base { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); }
  .score-pill .pill-label { font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .score-pill .pill-val { font-size: 15px; font-weight: 800; }
  .score-pill .pill-val.crack { background: linear-gradient(90deg, #facc15, #f59e0b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .score-pill .pill-val.base { background: linear-gradient(90deg, #10b981, #06b6d4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .cote-pill { background: #1e40af; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .value-badge { background: #f59e0b; color: #0f172a; padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 800; white-space: nowrap; }
  .role-badge { padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 800; white-space: nowrap; }
  .role-badge.crack-tag { background: rgba(250,204,21,0.2); color: #facc15; }

  /* ===== Jeux du Jour — lignes compactes ===== */
  .jour-summary {
    background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
    border-radius: 10px; padding: 12px 18px; margin-bottom: 14px;
    text-align: center; font-size: 13px; color: #94a3b8;
  }
  .jour-summary strong { color: #ef4444; }
  .jour-list { display: flex; flex-direction: column; gap: 6px; }
  .jour-row {
    background: rgba(30,41,59,0.7); border: 1px solid rgba(239,68,68,0.15);
    border-radius: 10px; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px; transition: all .2s;
  }
  .jour-row:hover { border-color: #ef4444; box-shadow: 0 0 14px rgba(239,68,68,0.1); }
  .jour-row .row-left { display: flex; align-items: center; gap: 10px; }
  .jour-row .row-race {
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    color: #fff; padding: 3px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 800; white-space: nowrap;
  }
  .jour-row .row-hippo { font-size: 12px; color: #94a3b8; }
  .jour-row .row-heure { font-size: 11px; color: #f59e0b; font-weight: 700; }
  .jour-row .row-numeros {
    font-size: 18px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg, #ef4444, #f59e0b);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .jour-row .row-meta { font-size: 10px; color: #64748b; }
  .jour-row .row-meta strong { color: #94a3b8; }
  .jour-row .row-right { text-align: right; }
  .jour-row .row-disc { font-size: 11px; color: #64748b; }

  /* ===== Loading / Empty / Footer ===== */
  .empty-state { text-align: center; padding: 50px 20px; color: #64748b; }
  .empty-state .emoji { font-size: 50px; margin-bottom: 14px; }
  .empty-state h2 { color: #e2e8f0; font-size: 18px; margin-bottom: 6px; }
  .empty-state p { font-size: 13px; line-height: 1.6; }
  .loading { text-align: center; padding: 50px 20px; color: #94a3b8; }
  .spinner { border: 3px solid #334155; border-top: 3px solid #facc15; border-radius: 50%; width: 34px; height: 34px; animation: spin 1s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .summary-bar { border-radius: 10px; padding: 10px 16px; margin-bottom: 16px; text-align: center; font-size: 13px; }
  .summary-bar.crack { background: rgba(250,204,21,0.08); border: 1px solid rgba(250,204,21,0.2); }
  .summary-bar.base { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2); }
  .summary-bar strong.crack { color: #facc15; }
  .summary-bar strong.base { color: #10b981; }
  .footer { text-align: center; padding: 24px 20px; color: #475569; font-size: 11px; }
  .footer a { color: #64748b; text-decoration: none; }
  .footer a:hover { color: #94a3b8; }

  @media (max-width: 600px) {
    .horse-card { gap: 8px; padding: 12px 14px; }
    .card-main .card-nom { font-size: 15px; }
    .card-right { width: 100%; justify-content: flex-start; }
    .tabs { gap: 3px; padding: 10px 6px 0; }
    .tab-btn { font-size: 11px; padding: 7px 6px; }
    .jour-row { flex-direction: column; align-items: flex-start; }
    .jour-row .row-right { text-align: left; }
  }
</style>
</head>
<body>
<header>
  <h1>⚡ Turfiou — Pronostics IA <span style="background:#facc15;color:#0f172a;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">v6</span></h1>
  <p>Analyse hippique par intelligence artificielle — 41 features · Dual Win/Top4 · Stacking ML</p>
  <div id="mlStatus" class="ml-status none"><span class="ml-dot"></span><span id="mlStatusText">Chargement…</span></div>
</header>

<div class="tabs">
  <button class="tab-btn active-crack" id="tabCrack" onclick="switchTab('crack')">
    <span class="tab-icon">⚡</span> Cracks
    <span class="tab-count" id="countCrack">—</span>
  </button>
  <button class="tab-btn" id="tabBase" onclick="switchTab('base')">
    <span class="tab-icon">🏆</span> Super Base
    <span class="tab-count" id="countBase">—</span>
  </button>
  <button class="tab-btn" id="tabJour" onclick="switchTab('jour')">
    <span class="tab-icon">🎯</span> Jeux du Jour
    <span class="tab-count" id="countJour">—</span>
  </button>
</div>

<div class="container">
  <div class="date-bar">
    <input type="date" id="datePicker">
    <button onclick="loadAll()">🔍 Chercher</button>
  </div>
  <div id="resultsBlock">
    <div class="loading"><div class="spinner"></div>Chargement…</div>
  </div>
</div>

<div class="footer">
  <p>Turfiou — Analyse hippique par IA — <strong>v6</strong> 41 features · Dual Win/Top4 · Stacking ML</p>
  <p style="margin-top:4px;">Le jeu comporte des risques : <a href="https://www.joueurs-info-service.fr/">joueurs-info-service.fr</a></p>
</div>

<script>
let currentTab = 'crack';
let cacheData = { crack: null, base: null, jour: null, programme: null };

function todayStr() { return new Date().toISOString().slice(0,10); }
function toApiDate(s) { const [y,m,d] = s.split('-'); return d+m+y; }

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabCrack').className = 'tab-btn' + (tab === 'crack' ? ' active-crack' : '');
  document.getElementById('tabBase').className = 'tab-btn' + (tab === 'base' ? ' active-base' : '');
  document.getElementById('tabJour').className = 'tab-btn' + (tab === 'jour' ? ' active-jour' : '');
  renderCurrent();
}

async function loadAll() {
  const dateVal = document.getElementById('datePicker').value;
  const dateApi = toApiDate(dateVal);
  const block = document.getElementById('resultsBlock');
  block.innerHTML = '<div class="loading"><div class="spinner"></div>Analyse en cours… (1ère fois : 1-3 min)</div>';

  try {
    const [resCrack, resBase, resProg] = await Promise.all([
      fetch(`/api/crack-horses?date=${dateApi}`).then(r => r.json()),
      fetch(`/api/super-base?date=${dateApi}`).then(r => r.json()),
      fetch(`/api/programme-public?date=${dateApi}`).then(r => r.json())
    ]);
    if (resCrack.error) throw new Error(resCrack.error);
    if (resBase.error) throw new Error(resBase.error);
    if (resProg.error) throw new Error(resProg.error);

    cacheData.crack = resCrack;
    cacheData.base = resBase;
    cacheData.programme = resProg;

    // Charger les sélections pour toutes les courses (en parallèle)
    const jourPromises = [];
    (resProg.reunions || []).forEach(reu => {
      reu.courses.forEach(c => {
        jourPromises.push(
          fetch(`/api/course-du-jour?date=${dateApi}&r=${reu.numReunion}&c=${c.numCourse}`)
            .then(r => r.json()).catch(() => null)
        );
      });
    });
    const jourResults = await Promise.all(jourPromises);
    cacheData.jour = jourResults.filter(r => r && r.selection && r.selection.length > 0);

    document.getElementById('countCrack').textContent = (resCrack.cracks || []).length;
    document.getElementById('countBase').textContent = (resBase.bases || []).length;
    document.getElementById('countJour').textContent = cacheData.jour.length + ' sel.';

    renderCurrent();
  } catch(e) {
    block.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><h2>Erreur</h2><p>${e.message}</p></div>`;
  }
}

function renderCurrent() {
  if (currentTab === 'crack' && cacheData.crack) renderCracks(cacheData.crack);
  else if (currentTab === 'base' && cacheData.base) renderBases(cacheData.base);
  else if (currentTab === 'jour' && cacheData.programme) renderJour();
}

function formatDate(dateStr) {
  if (dateStr && dateStr.length === 8) return `${dateStr.slice(0,2)}/${dateStr.slice(2,4)}/${dateStr.slice(4,8)}`;
  return dateStr || '';
}

function groupByReunion(items) {
  const map = {};
  items.forEach(item => {
    const key = item.num_reunion;
    if (!map[key]) map[key] = { num_reunion: item.num_reunion, hippodrome: item.hippodrome, items: [] };
    map[key].items.push(item);
  });
  return Object.values(map).sort((a, b) => a.num_reunion - b.num_reunion);
}

function groupByCourse(items) {
  const map = {};
  items.forEach(item => {
    const key = item.num_course;
    if (!map[key]) map[key] = { num_course: key, info: item, items: [] };
    map[key].items.push(item);
  });
  return Object.values(map).sort((a, b) => a.num_course - b.num_course);
}

/* ===== RENDER CRACKS ===== */
function renderCracks(data) {
  const block = document.getElementById('resultsBlock');
  const cracks = data.cracks || [];
  if (!cracks.length) {
    block.innerHTML = `<div class="empty-state"><div class="emoji">🏇</div><h2>Aucun cheval Crack</h2><p>Score ELO ≥ 85 non atteint.</p></div>`;
    return;
  }
  const reunions = groupByReunion(cracks);
  let html = `<div class="summary-bar crack">⚡ <strong class="crack">${cracks.length}</strong> cheval${cracks.length>1?'x':''} Crack dans <strong class="crack">${reunions.length}</strong> réunion${reunions.length>1?'s':''} — <strong>${formatDate(data.date)}</strong></div>`;
  reunions.forEach(reu => {
    html += `<div class="reunion-block"><div class="reunion-header crack-style">
      <div class="reunion-title"><span class="reunion-num crack">R${reu.num_reunion}</span><span class="reunion-hippo">📍 ${reu.hippodrome}</span></div>
      <span class="reunion-count crack">${reu.items.length} crack${reu.items.length>1?'s':''}</span></div><div class="reunion-body">`;
    const courses = groupByCourse(reu.items);
    courses.forEach(cou => {
      const ci = cou.info;
      html += `<div class="course-sep"><span class="course-label crack">Course ${cou.num_course}</span>
        <span class="course-infos">${ci.discipline||''} ${ci.distance?ci.distance+'m':''} — ${ci.nb_partants} partants</span>
        <span class="course-heure">🕐 ${ci.heure||'—'}</span></div>`;
      cou.items.sort((a, b) => b.elo_score - a.elo_score);
      cou.items.forEach(c => { html += horseCard(c, 'crack'); });
    });
    html += `</div></div>`;
  });
  block.innerHTML = html;
}

/* ===== RENDER SUPER BASE ===== */
function renderBases(data) {
  const block = document.getElementById('resultsBlock');
  const bases = data.bases || [];
  if (!bases.length) {
    block.innerHTML = `<div class="empty-state"><div class="emoji">🏇</div><h2>Aucune course</h2></div>`;
    return;
  }
  const reunions = groupByReunion(bases);
  let html = `<div class="summary-bar base">🏆 <strong class="base">${bases.length}</strong> sélection${bases.length>1?'s':''} dans <strong class="base">${reunions.length}</strong> réunion${reunions.length>1?'s':''} — <strong>${formatDate(data.date)}</strong></div>`;
  reunions.forEach(reu => {
    html += `<div class="reunion-block"><div class="reunion-header base-style">
      <div class="reunion-title"><span class="reunion-num base">R${reu.num_reunion}</span><span class="reunion-hippo">📍 ${reu.hippodrome}</span></div>
      <span class="reunion-count base">${reu.items.length} course${reu.items.length>1?'s':''}</span></div><div class="reunion-body">`;
    reu.items.sort((a, b) => a.num_course - b.num_course);
    reu.items.forEach(c => {
      html += `<div class="course-sep"><span class="course-label base">Course ${c.num_course}</span>
        <span class="course-infos">${c.discipline||''} ${c.distance?c.distance+'m':''} — ${c.nb_partants} partants</span>
        <span class="course-heure">🕐 ${c.heure||'—'}</span></div>`;
      html += horseCard(c, 'base');
    });
    html += `</div></div>`;
  });
  block.innerHTML = html;
}

/* ===== RENDER JEUX DU JOUR ===== */
function renderJour() {
  const block = document.getElementById('resultsBlock');
  const sel = cacheData.jour || [];

  if (!sel.length) {
    block.innerHTML = `<div class="empty-state"><div class="emoji">🏇</div><h2>Aucune sélection</h2><p>Pas de programme ou analyse en cours.</p></div>`;
    return;
  }

  let html = `<div class="jour-summary">
    🎯 <strong>${sel.length}</strong> sélection${sel.length>1?'s':''} — Top 7 par course — <strong>${formatDate(cacheData.programme.date)}</strong>
  </div>`;

  html += '<div class="jour-list">';
  sel.sort((a, b) => {
    const ar = a.course ? a.course.r_num : 0, br = b.course ? b.course.r_num : 0;
    const ac = a.course ? a.course.c_num : 0, bc = b.course ? b.course.c_num : 0;
    return ar - br || ac - bc;
  });

  sel.forEach(item => {
    const c = item.course;
    const s = item.selection;
    const nums = s.map(h => h.numPmu).join('-');
    const disc = `${c.discipline||''} ${c.distance?c.distance+'m':''}`;
    const meta = `${c.nb_partants} partants` + (s[0] ? ` · Chance #1 : ${s[0].chance}%` : '');

    html += `<div class="jour-row">
      <div class="row-left">
        <span class="row-race">R${c.r_num}C${c.c_num}</span>
        <span class="row-hippo">📍 ${c.hippodrome}</span>
        <span class="row-heure">🕐 ${c.heure}</span>
      </div>
      <div class="row-right">
        <div class="row-numeros">${nums}</div>
        <div class="row-meta">${disc} · <strong>${meta}</strong></div>
      </div>
    </div>`;
  });

  html += '</div>';
  block.innerHTML = html;
}

/* ===== Generic horse card (cracks/base) ===== */
function horseCard(c, style) {
  const eloPill = c.elo_score !== undefined
    ? `<div class="score-pill ${style}"><span class="pill-label">ELO</span><span class="pill-val ${style}">${c.elo_score}</span></div>` : '';
  const stats = c.nb_courses ? `<span>📊 <strong>${c.nb_courses}c ${c.nb_victoires||0}V ${c.nb_places||0}P</strong></span>` : '';
  const gains = c.gains_carriere ? `<span>💰 <strong>${c.gains_carriere.toLocaleString()}€</strong></span>` : '';

  return `<div class="horse-card ${style}">
    <div class="card-num ${style}">${c.numPmu}</div>
    <div class="card-main">
      <div class="card-nom ${style}">${c.cheval}</div>
      <div class="card-details">
        ${c.age?`<span>🎂 <strong>${c.age} ans</strong></span>`:''}
        ${c.sexe?`<span>${c.sexe==='FEMELLES'?'♀️':(c.sexe==='HONGRES'?'骟':'♂️')} <strong>${c.sexe}</strong></span>`:''}
        <span>🏇 <strong>${c.driver}</strong></span>
        <span>👤 <strong>${c.entraineur}</strong></span>
        ${stats}${gains}
      </div>
      ${c.musique?`<span class="card-musique">${c.musique}</span>`:''}
    </div>
    <div class="card-right">
      ${c.is_crack?`<span class="role-badge crack-tag">⚡ Crack</span>`:''}
      ${c.chanceTop4?`<span class="role-badge" style="background:rgba(6,182,212,0.2);color:#06b6d4;">🎯 T4 ${Math.round(c.chanceTop4)}%</span>`:''}
      ${eloPill}
      ${c.cote?`<span class="cote-pill">Cote ${c.cote}</span>`:''}
    </div>
  </div>`;
}

/* ===== ML Status ===== */
async function loadMLStatus() {
  try {
    const res = await fetch('/api/ml-status');
    const data = await res.json();
    const el = document.getElementById('mlStatus');
    const txt = document.getElementById('mlStatusText');
    if (data.status === 'ok') {
      el.className = 'ml-status ok';
      const ts = data.finished_at ? new Date(data.finished_at) : null;
      const timeStr = ts ? ts.toLocaleDateString('fr-FR') + ' à ' + ts.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '';
      const source = data.source === 'manual' ? 'Manuel' : 'Auto 5h00';
      txt.textContent = `🧠 Maj ML OK — ${source} — ${timeStr}`;
    } else if (data.status === 'training') {
      el.className = 'ml-status training';
      const ts = data.started_at ? new Date(data.started_at) : null;
      const since = ts ? ts.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '';
      txt.textContent = `🧠 Entraînement en cours… (depuis ${since})`;
      setTimeout(loadMLStatus, 30000);
    } else if (data.status === 'error') {
      el.className = 'ml-status error';
      txt.textContent = `🧠 Maj ML échouée — ${data.error || 'erreur'}`;
    } else {
      el.className = 'ml-status none';
      txt.textContent = '🧠 Aucun modèle ML — résultats heuristiques';
    }
  } catch(e) {
    document.getElementById('mlStatusText').textContent = '🧠 Statut ML indisponible';
  }
}
