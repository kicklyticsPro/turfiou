<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turfiou — Chevaux Crack du Jour</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0; min-height: 100vh;
  }
  header {
    background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #facc15;
    padding: 16px 20px; text-align: center;
    backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
  }
  header h1 {
    font-size: 24px;
    background: linear-gradient(90deg, #facc15, #f59e0b);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    color: #94a3b8; font-size: 13px; margin-top: 4px;
  }
  .container {
    max-width: 800px; margin: 0 auto; padding: 20px 16px;
  }
  .date-bar {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .date-bar input[type=date] {
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    padding: 8px 14px; border-radius: 8px; font-size: 14px;
  }
  .date-bar button {
    background: #facc15; color: #0f172a; border: none;
    padding: 8px 18px; border-radius: 8px; font-size: 14px;
    font-weight: 700; cursor: pointer; transition: all .2s;
  }
  .date-bar button:hover { background: #f59e0b; }

  .crack-card {
    background: rgba(30, 41, 59, 0.7);
    border: 2px solid #facc15;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
    position: relative;
    transition: all .2s;
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.08);
  }
  .crack-card:hover {
    border-color: #fbbf24;
    box-shadow: 0 0 30px rgba(250, 204, 21, 0.15);
    transform: translateY(-2px);
  }
  .crack-card .crack-badge {
    position: absolute; top: -10px; left: 18px;
    background: linear-gradient(135deg, #facc15, #f59e0b);
    color: #0f172a; padding: 3px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
  }
  .crack-card .race-info {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px;
  }
  .crack-card .race-info .race-tag {
    background: #0f172a; color: #06b6d4; padding: 3px 10px;
    border-radius: 6px; font-size: 12px; font-weight: 700;
  }
  .crack-card .race-info .hippo {
    color: #94a3b8; font-size: 12px;
  }
  .crack-card .race-info .time {
    color: #f59e0b; font-size: 13px; font-weight: 700;
  }
  .crack-card h2 {
    font-size: 22px; margin-bottom: 6px;
    color: #facc15;
  }
  .crack-card .details {
    display: flex; gap: 16px; flex-wrap: wrap;
    color: #94a3b8; font-size: 13px; margin-bottom: 8px;
  }
  .crack-card .details span strong { color: #e2e8f0; }
  .crack-card .elo-block {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(250, 204, 21, 0.1);
    border: 1px solid rgba(250, 204, 21, 0.3);
    border-radius: 8px; padding: 6px 12px; margin-top: 4px;
  }
  .crack-card .elo-block .elo-label {
    font-size: 10px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .crack-card .elo-block .elo-val {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(90deg, #facc15, #f59e0b);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .crack-card .cote-tag {
    display: inline-block; background: #1e40af; color: white;
    padding: 3px 10px; border-radius: 5px; font-size: 13px;
    font-weight: 700; margin-left: 10px;
  }

  .empty-state {
    text-align: center; padding: 60px 20px; color: #64748b;
  }
  .empty-state .emoji { font-size: 60px; margin-bottom: 16px; }
  .empty-state h2 { color: #e2e8f0; font-size: 20px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  .loading {
    text-align: center; padding: 60px 20px; color: #94a3b8;
  }
  .spinner {
    border: 3px solid #334155; border-top: 3px solid #facc15;
    border-radius: 50%; width: 36px; height: 36px;
    animation: spin 1s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .summary-bar {
    background: rgba(250, 204, 21, 0.08);
    border: 1px solid rgba(250, 204, 21, 0.2);
    border-radius: 10px; padding: 12px 18px;
    margin-bottom: 20px; text-align: center;
    font-size: 14px;
  }
  .summary-bar strong { color: #facc15; }

  .footer {
    text-align: center; padding: 30px 20px;
    color: #475569; font-size: 11px;
  }
  .footer a { color: #64748b; text-decoration: none; }
  .footer a:hover { color: #94a3b8; }

  @media (max-width: 600px) {
    .crack-card h2 { font-size: 18px; }
    .crack-card .details { gap: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>⚡ Turfiou — Chevaux Crack du Jour</h1>
  <p>Seuls les chevaux avec un score ELO exceptionnel sont affichés</p>
</header>

<div class="container">
  <div class="date-bar">
    <input type="date" id="datePicker">
    <button onclick="loadCracks()">🔍 Chercher</button>
  </div>

  <div id="resultsBlock">
    <div class="loading">
      <div class="spinner"></div>
      Recherche des chevaux Crack en cours…
    </div>
  </div>
</div>

<div class="footer">
  <p>Turfiou — Analyse hippique par IA</p>
  <p style="margin-top:6px;">Le jeu comporte des risques : <a href="https://www.joueurs-info-service.fr/">joueurs-info-service.fr</a></p>
</div>

<script>
function todayStr() { return new Date().toISOString().slice(0,10); }
function toApiDate(s) { const [y,m,d] = s.split('-'); return d+m+y; }

async function loadCracks() {
  const dateVal = document.getElementById('datePicker').value;
  const dateApi = toApiDate(dateVal);
  const block = document.getElementById('resultsBlock');
  block.innerHTML = '<div class="loading"><div class="spinner"></div>Recherche des chevaux Crack en cours…</div>';

  try {
    const res = await fetch(`/api/crack-horses?date=${dateApi}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderCracks(data);
  } catch(e) {
    block.innerHTML = `<div class="empty-state">
      <div class="emoji">⚠️</div>
      <h2>Erreur</h2>
      <p>${e.message}</p>
    </div>`;
  }
}

function renderCracks(data) {
  const block = document.getElementById('resultsBlock');
  const cracks = data.cracks || [];

  if (cracks.length === 0) {
    block.innerHTML = `<div class="empty-state">
      <div class="emoji">🏇</div>
      <h2>Aucun cheval Crack trouvé</h2>
      <p>Pas de cheval avec un score ELO exceptionnel (≥ 85) pour cette date.<br>
      Essayez une autre journée de courses.</p>
    </div>`;
    return;
  }

  // Trier par score ELO décroissant
  cracks.sort((a, b) => b.elo_score - a.elo_score);

  let html = `
    <div class="summary-bar">
      🏆 <strong>${cracks.length}</strong> cheval${cracks.length > 1 ? 'x' : ''} recommandé${cracks.length > 1 ? 's' : ''}
      pour le <strong>${formatDate(data.date)}</strong>
    </div>
  `;

  cracks.forEach(c => {
    html += `
      <div class="crack-card">
        <span class="crack-badge">#${c.numPmu}</span>
        <div class="race-info">
          <span class="race-tag">${c.course}</span>
          <span class="hippo">📍 ${c.hippodrome} — ${c.discipline || ''} ${c.distance ? c.distance + 'm' : ''}</span>
          <span class="time">🕐 ${c.heure}</span>
        </div>
        <h2>${c.cheval}
          ${c.cote ? `<span class="cote-tag">Cote ${c.cote}</span>` : ''}
        </h2>
        <div class="details">
          ${c.age ? `<span>🎂 <strong>${c.age} ans</strong></span>` : ''}
          ${c.sexe ? `<span>${c.sexe === 'FEMELLES' ? '♀️' : (c.sexe === 'HONGRES' ? '骟' : '♂️')} <strong>${c.sexe}</strong></span>` : ''}
          <span>🏇 <strong>${c.driver}</strong></span>
          <span>👤 <strong>${c.entraineur}</strong></span>
          <span>🐎 <strong>${c.nb_partants} partants</strong></span>
        </div>
        <div class="elo-block">
          <span class="elo-label">ELO brut</span>
          <span class="elo-val">${c.elo_rating}</span>
          <span style="font-size:11px;color:#94a3b8;">≥ ${1560} requis</span>
        </div>
      </div>
    `;
  });

  block.innerHTML = html;
}

function formatDate(dateStr) {
  // dateStr format: "05062026"
  if (dateStr.length === 8) {
    return `${dateStr.slice(0,2)}/${dateStr.slice(2,4)}/${dateStr.slice(4,8)}`;
  }
  return dateStr;
}

// Init
document.getElementById('datePicker').value = todayStr();
loadCracks();
</script>
