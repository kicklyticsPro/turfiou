<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turfiou — Chevaux Crack du Jour</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0; min-height: 100vh;
  }
  header {
    background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #facc15;
    padding: 16px 20px; text-align: center;
    backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
  }
  header h1 {
    font-size: 24px;
    background: linear-gradient(90deg, #facc15, #f59e0b);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    color: #94a3b8; font-size: 13px; margin-top: 4px;
  }
  .container {
    max-width: 860px; margin: 0 auto; padding: 20px 16px;
  }
  .date-bar {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .date-bar input[type=date] {
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    padding: 8px 14px; border-radius: 8px; font-size: 14px;
  }
  .date-bar button {
    background: #facc15; color: #0f172a; border: none;
    padding: 8px 18px; border-radius: 8px; font-size: 14px;
    font-weight: 700; cursor: pointer; transition: all .2s;
  }
  .date-bar button:hover { background: #f59e0b; }

  /* ===== Réunion block ===== */
  .reunion-block {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid #334155;
    border-radius: 16px;
    margin-bottom: 24px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  }
  .reunion-header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    padding: 14px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #facc15;
    flex-wrap: wrap; gap: 8px;
  }
  .reunion-header .reunion-title {
    display: flex; align-items: center; gap: 10px;
  }
  .reunion-header .reunion-num {
    background: linear-gradient(135deg, #facc15, #f59e0b);
    color: #0f172a; font-size: 13px; font-weight: 800;
    padding: 4px 12px; border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .reunion-header .reunion-hippo {
    font-size: 16px; font-weight: 700; color: #e2e8f0;
  }
  .reunion-header .reunion-count {
    background: rgba(250, 204, 21, 0.15);
    color: #facc15; font-size: 12px; font-weight: 700;
    padding: 4px 12px; border-radius: 20px;
  }
  .reunion-body {
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }

  /* ===== Course séparateur ===== */
  .course-sep {
    display: flex; align-items: center; gap: 10px;
    margin-top: 6px; margin-bottom: 2px;
  }
  .course-sep .course-label {
    background: #0f172a; color: #06b6d4;
    padding: 3px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 700;
    white-space: nowrap;
  }
  .course-sep .course-infos {
    color: #94a3b8; font-size: 12px;
  }
  .course-sep .course-heure {
    color: #f59e0b; font-weight: 700; font-size: 12px;
    margin-left: auto; white-space: nowrap;
  }

  /* ===== Crack card ===== */
  .crack-card {
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(250, 204, 21, 0.3);
    border-radius: 12px;
    padding: 14px 18px;
    position: relative;
    transition: all .2s;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  }
  .crack-card:hover {
    border-color: #facc15;
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.12);
    transform: translateY(-1px);
  }
  .crack-card .card-num {
    background: linear-gradient(135deg, #facc15, #f59e0b);
    color: #0f172a; width: 32px; height: 32px;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 800;
    flex-shrink: 0;
  }
  .crack-card .card-main {
    flex: 1; min-width: 150px;
  }
  .crack-card .card-main .card-nom {
    font-size: 18px; font-weight: 700; color: #facc15;
    margin-bottom: 4px;
  }
  .crack-card .card-main .card-details {
    display: flex; gap: 12px; flex-wrap: wrap;
    color: #94a3b8; font-size: 12px;
  }
  .crack-card .card-main .card-details strong { color: #e2e8f0; }
  .crack-card .card-right {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .elo-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(250, 204, 21, 0.1);
    border: 1px solid rgba(250, 204, 21, 0.25);
    border-radius: 20px; padding: 5px 12px;
  }
  .elo-pill .elo-label {
    font-size: 9px; color: #64748b; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .elo-pill .elo-val {
    font-size: 16px; font-weight: 800;
    background: linear-gradient(90deg, #facc15, #f59e0b);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cote-pill {
    background: #1e40af; color: white;
    padding: 4px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    white-space: nowrap;
  }

  /* ===== Empty / Loading ===== */
  .empty-state {
    text-align: center; padding: 60px 20px; color: #64748b;
  }
  .empty-state .emoji { font-size: 60px; margin-bottom: 16px; }
  .empty-state h2 { color: #e2e8f0; font-size: 20px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  .loading {
    text-align: center; padding: 60px 20px; color: #94a3b8;
  }
  .spinner {
    border: 3px solid #334155; border-top: 3px solid #facc15;
    border-radius: 50%; width: 36px; height: 36px;
    animation: spin 1s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .summary-bar {
    background: rgba(250, 204, 21, 0.08);
    border: 1px solid rgba(250, 204, 21, 0.2);
    border-radius: 10px; padding: 12px 18px;
    margin-bottom: 20px; text-align: center;
    font-size: 14px;
  }
  .summary-bar strong { color: #facc15; }

  .footer {
    text-align: center; padding: 30px 20px;
    color: #475569; font-size: 11px;
  }
  .footer a { color: #64748b; text-decoration: none; }
  .footer a:hover { color: #94a3b8; }

  @media (max-width: 600px) {
    .crack-card { gap: 8px; padding: 12px 14px; }
    .crack-card .card-main .card-nom { font-size: 15px; }
    .crack-card .card-right { width: 100%; justify-content: flex-start; }
    .reunion-header { padding: 12px 14px; }
  }
</style>
</head>
<body>
<header>
  <h1>⚡ Turfiou — Chevaux Crack du Jour</h1>
  <p>Seuls les chevaux avec un score ELO exceptionnel sont affichés</p>
</header>

<div class="container">
  <div class="date-bar">
    <input type="date" id="datePicker">
    <button onclick="loadCracks()">🔍 Chercher</button>
  </div>

  <div id="resultsBlock">
    <div class="loading">
      <div class="spinner"></div>
      Recherche des chevaux Crack en cours…
    </div>
  </div>
</div>

<div class="footer">
  <p>Turfiou — Analyse hippique par IA</p>
  <p style="margin-top:6px;">Le jeu comporte des risques : <a href="https://www.joueurs-info-service.fr/">joueurs-info-service.fr</a></p>
</div>

<script>
function todayStr() { return new Date().toISOString().slice(0,10); }
function toApiDate(s) { const [y,m,d] = s.split('-'); return d+m+y; }

async function loadCracks() {
  const dateVal = document.getElementById('datePicker').value;
  const dateApi = toApiDate(dateVal);
  const block = document.getElementById('resultsBlock');
  block.innerHTML = '<div class="loading"><div class="spinner"></div>Recherche des chevaux Crack en cours…</div>';

  try {
    const res = await fetch(`/api/crack-horses?date=${dateApi}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderCracks(data);
  } catch(e) {
    block.innerHTML = `<div class="empty-state">
      <div class="emoji">⚠️</div>
      <h2>Erreur</h2>
      <p>${e.message}</p>
    </div>`;
  }
}

function renderCracks(data) {
  const block = document.getElementById('resultsBlock');
  const cracks = data.cracks || [];

  if (cracks.length === 0) {
    block.innerHTML = `<div class="empty-state">
      <div class="emoji">🏇</div>
      <h2>Aucun cheval Crack trouvé</h2>
      <p>Pas de cheval avec un score ELO exceptionnel (≥ 85) pour cette date.<br>
      Essayez une autre journée de courses.</p>
    </div>`;
    return;
  }

  // Grouper par réunion (hippodrome + num_reunion)
  const reunions = {};
  cracks.forEach(c => {
    const key = c.num_reunion;
    if (!reunions[key]) {
      reunions[key] = {
        num_reunion: c.num_reunion,
        hippodrome: c.hippodrome,
        cracks: []
      };
    }
    reunions[key].cracks.push(c);
  });

  // Trier les réunions par numéro
  const sortedReunions = Object.values(reunions).sort((a, b) => a.num_reunion - b.num_reunion);

  const totalCracks = cracks.length;

  let html = `
    <div class="summary-bar">
      🏆 <strong>${totalCracks}</strong> cheval${totalCracks > 1 ? 'x' : ''} Crack
      réparti${totalCracks > 1 ? 's' : ''} dans <strong>${sortedReunions.length}</strong> réunion${sortedReunions.length > 1 ? 's' : ''}
      — <strong>${formatDate(data.date)}</strong>
    </div>
  `;

  sortedReunions.forEach(reu => {
    const nb = reu.cracks.length;
    html += `
      <div class="reunion-block">
        <div class="reunion-header">
          <div class="reunion-title">
            <span class="reunion-num">R${reu.num_reunion}</span>
            <span class="reunion-hippo">📍 ${reu.hippodrome}</span>
          </div>
          <span class="reunion-count">${nb} crack${nb > 1 ? 's' : ''}</span>
        </div>
        <div class="reunion-body">
    `;

    // Sous-grouper par course
    const courses = {};
    reu.cracks.forEach(c => {
      const ck = c.num_course;
      if (!courses[ck]) {
        courses[ck] = { num_course: ck, infos: c, horses: [] };
      }
      courses[ck].horses.push(c);
    });

    const sortedCourses = Object.values(courses).sort((a, b) => a.num_course - b.num_course);

    sortedCourses.forEach(cou => {
      html += `
          <div class="course-sep">
            <span class="course-label">Course ${cou.num_course}</span>
            <span class="course-infos">${cou.infos.discipline || ''} ${cou.infos.distance ? cou.infos.distance + 'm' : ''} — ${cou.infos.nb_partants} partants</span>
            <span class="course-heure">🕐 ${cou.infos.heure || '—'}</span>
          </div>
      `;

      // Trier les chevaux par ELO décroissant dans la course
      cou.horses.sort((a, b) => b.elo_score - a.elo_score);

      cou.horses.forEach(c => {
        html += `
          <div class="crack-card">
            <div class="card-num">${c.numPmu}</div>
            <div class="card-main">
              <div class="card-nom">${c.cheval}</div>
              <div class="card-details">
                ${c.age ? `<span>🎂 <strong>${c.age} ans</strong></span>` : ''}
                ${c.sexe ? `<span>${c.sexe === 'FEMELLES' ? '♀️' : (c.sexe === 'HONGRES' ? '骟' : '♂️')} <strong>${c.sexe}</strong></span>` : ''}
                <span>🏇 <strong>${c.driver}</strong></span>
                <span>👤 <strong>${c.entraineur}</strong></span>
                ${c.nb_courses ? `<span>📊 <strong>${c.nb_courses} courses</strong></span>` : ''}
              </div>
            </div>
            <div class="card-right">
              <div class="elo-pill">
                <span class="elo-label">ELO</span>
                <span class="elo-val">${c.elo_score}</span>
              </div>
              ${c.cote ? `<span class="cote-pill">Cote ${c.cote}</span>` : ''}
            </div>
          </div>
        `;
      });
    });

    html += `
        </div>
      </div>
    `;
  });

  block.innerHTML = html;
}

function formatDate(dateStr) {
  if (dateStr.length === 8) {
    return `${dateStr.slice(0,2)}/${dateStr.slice(2,4)}/${dateStr.slice(4,8)}`;
  }
  return dateStr;
}

// Init
document.getElementById('datePicker').value = todayStr();
loadCracks();
</script>
